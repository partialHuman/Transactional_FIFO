name: Transactional FIFO Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  simulation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Compile FIFO
        run: |
          mkdir -p build
          iverilog -g2012 \
            -o build/fifo_sim \
            rtl/transactional_fifo.v \
            sim/tb_transactional_fifo.v

      - name: Run verification
        run: |
          set -o pipefail
          vvp build/fifo_sim | tee build/verification.log

      - name: Check verification result
        run: |
          grep -q "282 PASS / 0 FAIL / 282 TOTAL" build/verification.log
          grep -q "ALL TESTS PASSED" build/verification.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-log
          path: build/verification.log